openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: counsel
    description: Marcus Aurelius-style reflective counsel
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /counsel:
    post:
      operationId: createCounsel
      tags: [counsel]
      summary: Generate grounded Stoic counsel
      description: Returns a reflective response grounded in Marcus Aurelius and Stoic principles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CounselInput"
      responses:
        "200":
          description: Generated counsel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Counsel"
        "400":
          description: Invalid question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Counsel service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CounselInput:
      type: object
      properties:
        question:
          type: string
          minLength: 2
          maxLength: 4000
        history:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/CounselTurn"
      required:
        - question
    CounselTurn:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 4000
      required:
        - role
        - content
    Counsel:
      type: object
      properties:
        answer:
          type: string
        source:
          type: string
          enum: [meditations, stoic-reflection]
        principle:
          type: string
        provider:
          type: string
          enum: [groq, openai, local]
      required:
        - answer
        - source
        - principle
        - provider
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

